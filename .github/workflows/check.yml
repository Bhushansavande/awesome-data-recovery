name: Check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 1 * *"      # every month: report broken links
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/check_format.py
  links:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - run: python scripts/check_links.py
